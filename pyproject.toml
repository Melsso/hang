[project]
name = "hang"
version = "0.1.0"
description = ""
authors = [
    {name = "Mallem Sofiane",email = "melsopv@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "pydantic[email] (>=2.13.3,<3.0.0)",
    "uvicorn[standard] (>=0.47.0,<0.48.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "pycountry (>=26.2.16,<27.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "python-multipart (>=0.0.27,<0.0.28)",
    "authlib (>=1.7.0,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "pathlib (>=1.0.1,<2.0.0)",
    "passlib (==1.7.4)",
    "bcrypt (==3.2.2)",
    "boto3 (>=1.43.10,<2.0.0)",
]

[tool.poetry]
packages = [{include = "hang", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.13,<0.16.0)"
]
