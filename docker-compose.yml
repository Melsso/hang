services:
  nginx:
    build:
      context: .
      dockerfile: ./infra/nginx/Dockerfile
    container_name: hang-nginx
    ports:
      - "8000:80"
    depends_on:
      - api
    networks:
      - hang-network

  api:
    build:
      context: ./hang-backend
      dockerfile: Dockerfile.hang
    env_file:
      - ./hang-backend/.api_env
    networks:
      - hang-network
    expose:
      - "8000"
    labels:
      prometheus.scrape: "true"
      service: "api"

  prometheus:
    build:
      context: ./infra/prometheus
      dockerfile: Dockerfile
    container_name: hang-prometheus
    expose:
      - "9090"
    networks:
      - hang-network
    restart: unless-stopped

  grafana:
    build:
      context: ./infra/grafana
      dockerfile: Dockerfile
    container_name: hang-grafana
    ports:
      - "3000:3000"
    networks:
      - hang-network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  hang-network:
    external: true