{% extends "base.html" %}

{% block title %}Settings{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/css/settings.css">
{% endblock %}

{% block content %}

<div class="app-container">
    <div class="top-actions">
        <button onclick="location.href='/api/swipes/home'">Home</button>
        <button onclick="location.href='/api/users/profile'">Profile</button>
        <button onclick="location.href='/api/conversations'">Messages</button>
        <button onclick="location.href='/api/settings'">Settings</button>    
        <form method="post" action="/api/auth/logout">
            <button type="submit">Logout</button>
        </form>
    
    </div>
    
    <div id="restrictPanel" class="restrict-panel hidden">
        <div id="restrictBody"></div>
    </div>

    <div class="settings-grid">
        <div class="settings-header">
            <h1>Settings</h1>
        </div>

        <div class="settings-card">
            <h2>Blocked Users</h2>
            <button class="btn secondary" onclick="loadBlocked()">
                Show
            </button>
        </div>

        <div class="settings-card">
            <h2>Reports</h2>
            <button class="btn secondary" onclick="loadReports()">
                Show
            </button>
        </div>

        <div class="settings-card">
            <h2>Password Management</h2>
            <button class="btn secondary" onclick="changePswd()">
                Change
            </button>
        </div>        

        <div class="settings-card danger-zone">
            <h2>Account</h2>
            <button class="btn primary" onclick="deleteAccount()">
                Delete Account
            </button>
        </div>

    </div>

</div>

<script>

async function loadBlocked() {
    const res = await fetch("/api/settings/blocks");
    const blocks = await res.json();

    const restrictPanelDiv = document.getElementById("restrictPanel");
    restrictPanelDiv.classList.remove("hidden");

    const restrictBodyDiv = document.getElementById("restrictBody");
    restrictBodyDiv.innerHTML = `
        <button id="closeRestrict">✕</button>
        <h2>Blocked Users</h2>
    `;

    document.getElementById("closeRestrict").onclick = () => {
        restrictPanelDiv.classList.add("hidden");
    };

    if (!blocks || blocks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "settings-empty";
        empty.innerText = "No blocked users";
        restrictBodyDiv.appendChild(empty);
        return;
    }

    blocks.forEach(u => {
        const row = document.createElement("div");
        row.className = "settings-row";
        row.innerHTML = `
            <span>${u.first_name} ${u.last_name}</span>
            <button class="btn primary" onclick="unblockUser(${u.user_id})">
                Unblock
            </button>
        `;
        restrictBodyDiv.appendChild(row);
    });
}

async function unblockUser(userId) {
    await fetch("/api/settings/unblock", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ blocked_user_id: userId })
    });

    loadBlocked();
}

async function loadReports() {
    const res = await fetch("/api/settings/reports");
    const reports = await res.json();

    const restrictPanelDiv = document.getElementById("restrictPanel");
    restrictPanelDiv.classList.remove("hidden");

    const restrictBodyDiv = document.getElementById("restrictBody");
    restrictBodyDiv.innerHTML = `
        <button id="closeRestrict">✕</button>
        <h2>Reports List</h2>
    `;

    document.getElementById("closeRestrict").onclick = () => {
        restrictPanelDiv.classList.add("hidden");
    };

    if (!reports || reports.length === 0) {
        const empty = document.createElement("div");
        empty.className = "settings-empty";
        empty.innerText = "No reports found";
        restrictBodyDiv.appendChild(empty);
        return;
    }

    reports.forEach(r => {
        const row = document.createElement("div");
        row.className = "settings-row";
        row.innerHTML = `
            <div class="report-meta">
                <span class="report-name">${r.first_name} ${r.last_name} | </span>
                <span class="report-reason">${r.reason}</span>
            </div>
            <button class="btn primary" onclick="deleteReport(${r.reported_id})">Unreport</button>
        `;
        restrictBodyDiv.appendChild(row);
    });
}

async function deleteReport(reportId) {
    await fetch("/api/settings/report-delete", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ reported_user_id: reportId })
    });

    loadReports();
}

async function changePswd() {
    const restrictPanelDiv = document.getElementById("restrictPanel");
    const restrictBodyDiv = document.getElementById("restrictBody");

    restrictPanelDiv.classList.remove("hidden");
    restrictBodyDiv.innerHTML = `
        <button id="closeRestrict">✕</button>
        <h2>Password Update</h2>

        <div class="password-row">
            <label>Old Password</label>
            <input type="password" id="oldPassword" />
        </div>

        <div class="password-row">
            <label>New Password</label>
            <input type="password" id="newPassword" />
        </div>

        <div class="password-row">
            <button id="submitPasswordChange" class="btn primary">
                Update Password
            </button>
        </div>

        <p id="passwordError" style="color: red; font-size: 12px;"></p>
    `;
    document.getElementById("closeRestrict").onclick = () => {
        restrictPanelDiv.classList.add("hidden");
    };

    const submitBtn = document.getElementById("submitPasswordChange");
    submitBtn.onclick = async () => {
        const oldPassword = document.getElementById("oldPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        const errorEl = document.getElementById("passwordError");

        errorEl.textContent = "";
        if (!oldPassword || !newPassword) {
            errorEl.textContent = "Both fields are required.";
            return;
        }
        try {
            const res = await fetch("/api/settings/change-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    old_password: oldPassword,
                    new_password: newPassword,
                }),
            });

            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                errorEl.textContent = data.msg || "Password update failed.";
                return;
            }

            restrictPanelDiv.classList.add("hidden");
            alert("Password updated successfully");
        } catch (err) {
            errorEl.textContent = "Network error.";
        }
    };
}

async function deleteAccount() {
    const res = await fetch("/api/settings/delete-account", {
        method: "POST"
    });
    if (res.ok) window.location.href = "/api/auth/login";
}

</script>

{% endblock %}
