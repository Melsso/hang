{% extends "base.html" %}

{% block title %}Messages{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/css/conversations.css">
{% endblock %}

{% block content %}

<div class="app-container">

    <div class="top-actions">
        <button onclick="location.href='/api/users/profile'">Profile</button>
        <button onclick="location.href='/api/swipes/home'">Home</button>
        
        <form method="post" action="/api/auth/logout">
            <button type="submit">Log Out</button>
        </form>
    </div>

    <div class="messages-card">

        <div class="conversations-panel">
            <h3>Conversations</h3>
            <div id="conversationList"></div>
        </div>

        <div class="chat-panel">

            <div class="chat-header" id="chatHeader">
                Select a conversation
            </div>

            <div class="chat-messages" id="chatMessages"></div>

            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button id="sendBtn">Send</button>
            </div>

        </div>

    </div>

</div>

<script>
let conversations = {{ conversations | tojson }};
let currentConversationId = null;
let currentUserId = null;

let socket = null;

/* =========================
   SOCKET
========================= */
function initSocket() {
    socket = new WebSocket("/api/ws/conversations");

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "message") {
            const msg = data.message;
            console.log("💬 MESSAGE EVENT:", msg);

            if (msg.conversation_id === currentConversationId) {
                console.log("✅ RENDERING MESSAGE IN UI");

                renderMessage(msg);
                scrollToBottom();
            } else {
                console.log("🚫 MESSAGE NOT FOR ACTIVE CHAT");
            }   
        }
    };
}

/* =========================
   SEND MESSAGE
========================= */
function sendMessage() {
    const input = document.getElementById("messageInput");

    const content = input.value.trim();
    if (!content || !currentConversationId) return;

    socket.send(JSON.stringify({
        conversation_id: currentConversationId,
        content: content
    }));

    input.value = "";
}

/* =========================
   MESSAGE RENDERING
========================= */
function renderMessage(m) {
    const container = document.getElementById("chatMessages");

    const div = document.createElement("div");
    div.className = "message";

    if (m.sender_id === currentUserId) {
        div.classList.add("mine");
    } else {
        div.classList.add("theirs");
    }

    div.innerText = m.content;

    container.appendChild(div);
}

/* =========================
   SCROLL
========================= */
function scrollToBottom() {
    const container = document.getElementById("chatMessages");
    container.scrollTop = container.scrollHeight;
}

/* =========================
   CONVERSATIONS LIST
========================= */
function renderConversations() {
    const container = document.getElementById("conversationList");
    container.innerHTML = "";

    conversations.forEach(c => {
        const div = document.createElement("div");
        div.className = "conversation-item";

        div.innerHTML = `
            <img class="conversation-avatar"
                title="View profile"
                src="${c.other_user_img_url || '/static/images/default_user.png'}">
            <span class="conversation-name" title="Open chat">${c.other_user_name}</span>
        `;

        const avatar = div.querySelector(".conversation-avatar");
        const name = div.querySelector(".conversation-name");

        name.onclick = () => openConversation(c);

        avatar.onclick = (e) => {
            e.stopPropagation();
            window.location.href = `/api/users/profile/${c.other_user_id}`;
        };

        container.appendChild(div);
    });
}

/* =========================
   OPEN CONVERSATION
========================= */
async function openConversation(c) {
    currentConversationId = c.conversation_id;

    document.getElementById("chatHeader").innerText = c.other_user_name;

    const res = await fetch(`/api/conversations/${c.conversation_id}/messages`);
    const data = await res.json();

    currentUserId = data.current_user_id;

    const container = document.getElementById("chatMessages");
    container.innerHTML = "";

    if (data.messages) {
        data.messages.forEach(renderMessage);
    }

    scrollToBottom();
}

/* =========================
   EVENTS
========================= */
document.getElementById("sendBtn").onclick = sendMessage;

document.getElementById("messageInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        sendMessage();
    }
});

window.addEventListener("beforeunload", () => {
    if (socket) socket.close();
});

/* =========================
   INIT
========================= */
renderConversations();
initSocket();

</script>

{% endblock %}
