{% extends "base.html" %}

{% block title %}Messages{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/css/conversations.css">
{% endblock %}

{% block content %}

<div class="app-container">

    <div class="top-actions">
        <button onclick="location.href='/api/swipes/home'">Home</button>
        <button onclick="location.href='/api/users/profile'">Profile</button>
        <button onclick="location.href='/api/conversations'">Messages</button>
        <button onclick="location.href='/api/settings'">Settings</button>
        <form method="post" action="/api/auth/logout">
            <button type="submit">Logout</button>
        </form>
    </div>

    <div class="messages-card">

        <div class="conversations-panel">
            <h3>Conversations</h3>
            <div id="conversationList"></div>
        </div>

        <div class="chat-panel">

            <div class="chat-header" id="chatHeader">
                Select a conversation
            </div>

            <div class="chat-messages" id="chatMessages"></div>
            <div id="typingIndicator" class="typing-indicator" style="font-size: 12px; color: gray;"></div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button id="sendBtn">Send</button>
            </div>

        </div>

    </div>

</div>

<script>
let conversations = {{ conversations | tojson }};
let currentConversationId = null;
let currentUserId = null;
let lastMessageEl = null;
let socket = null;
let typingTimeout = null;
let isTyping = false;

const conversationElements = {};

function initSocket() {
    socket = new WebSocket("/api/ws/conversations");

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "ping") {
            socket.send(JSON.stringify({ type: "pong" }));
            return;
        }

        if (data.type == "read") {
            const isActiveChat = data.conversation_id === currentConversationId;
            if (!isActiveChat) return;
            if (currentUserId == data.user_id) return;
            if (lastMessageEl) {
                const status = lastMessageEl.querySelector(".message-status");
                if (status) status.innerText = "read";
            }
        }

        if (data.type === "message") {
            const msg = data.message;

            const isActiveChat = msg.conversation_id === currentConversationId;
            if (isActiveChat) {
                renderMessage(msg);
                scrollToBottom();
                if (msg.sender_id != currentUserId) {
                    socket.send(JSON.stringify({
                        type: "read",
                        conversation_id: currentConversationId
                    }));
                }
                if (currentUserId != msg.sender_id) {
                    const status = lastMessageEl.querySelector(".message-status");
                    if (status) status.innerText = "read";
                } 
            }
            updateConversationPreview(msg, isActiveChat);
        }

        if (data.type === "typing") {
            if (
                data.conversation_id === currentConversationId &&
                data.user_id !== currentUserId
            ) {
                showTypingIndicator(data.is_typing);
            }
        }
    };
}

function showTypingIndicator(isTyping) {
    const el = document.getElementById("typingIndicator");
    if (!el) return;

    el.innerText = "typing...";
    el.style.display = isTyping ? "block" : "none";
}

function sendMessage() {
    const input = document.getElementById("messageInput");

    const content = input.value.trim();
    if (!content || !currentConversationId) return;

    socket.send(JSON.stringify({
        conversation_id: currentConversationId,
        content: content
    }));

    input.value = "";
}

function handleTyping() {
    if (!currentConversationId) return;

    if (!isTyping) {
        isTyping = true;

        socket.send(JSON.stringify({
            type: "typing",
            conversation_id: currentConversationId,
            is_typing: true
        }));
    }

    clearTimeout(typingTimeout);

    typingTimeout = setTimeout(() => {
        isTyping = false;

        socket.send(JSON.stringify({
            type: "typing",
            conversation_id: currentConversationId,
            is_typing: false
        }));
    }, 1200);
}

function renderMessage(m) {
    const container = document.getElementById("chatMessages");

    const div = document.createElement("div");
    div.className = "message";

    div.classList.add(m.sender_id === currentUserId ? "mine" : "theirs");

    const content = document.createElement("div");
    content.className = "message-content";
    content.innerText = m.content;

    const status = document.createElement("div");
    status.className = "message-status";

    status.innerText = m.is_read ? "read" : "sent";

    div.appendChild(content);
    div.appendChild(status);

    if (lastMessageEl) {
        const oldStatus = lastMessageEl.querySelector(".message-status");
        if (oldStatus) oldStatus.remove();
    }

    lastMessageEl = div;

    container.appendChild(div);

    requestAnimationFrame(() => {
        container.scrollTop = container.scrollHeight;
    });
}

function scrollToBottom() {
    const container = document.getElementById("chatMessages");
    container.scrollTop = container.scrollHeight;
}

function updateConversationPreview(msg, isActiveChat) {
    const el = conversationElements[msg.conversation_id];
    if (!el) return;

    const preview = el.querySelector(".conversation-preview");
    if (preview) {
        preview.innerText = msg.content;
    }

    if (!isActiveChat) {
        const badge = el.querySelector(".unread-count");

        let count = parseInt(badge?.innerText || "0");
        count += 1;

        if (badge) {
            badge.innerText = count;
            badge.style.display = "inline-block";
        }
    }

    const list = document.getElementById("conversationList");
    if (list.firstChild !== el) list.prepend(el);
}

function renderConversations() {
    const container = document.getElementById("conversationList");
    container.innerHTML = "";

    conversations.forEach(c => {
        const div = document.createElement("div");
        div.className = "conversation-item";

        div.innerHTML = `
            <img class="conversation-avatar"
                src="${c.other_user_img_url || '/static/images/default_user.png'}">

            <div class="conversation-meta">
                <span class="conversation-name">${c.other_user_name}</span>
                <span class="conversation-preview">
                    ${c.last_message || ""}
                </span>
            </div>

            <span class="unread-count" style="display:${c.unread_count > 0 ? "inline-block" : "none"}">
                ${c.unread_count || 0}
            </span>
        `;
        const avatar = div.querySelector(".conversation-avatar");
        avatar.onclick = (e) => {
            e.stopPropagation();
            window.location.href = `/api/users/profile/${c.other_user_id}`;
        };

        conversationElements[c.conversation_id] = div;

        div.onclick = () => openConversation(c);

        container.appendChild(div);
    });
}

async function openConversation(c) {
    currentConversationId = c.conversation_id;

    document.getElementById("chatHeader").innerText = c.other_user_name;

    const res = await fetch(`/api/conversations/${c.conversation_id}/messages`);
    const data = await res.json();

    currentUserId = data.current_user_id;

    const container = document.getElementById("chatMessages");
    container.innerHTML = "";

    data.messages?.forEach(renderMessage);

    requestAnimationFrame(() => {
        scrollToBottom();
    });

    const el = conversationElements[c.conversation_id];
    if (el) {
        const badge = el.querySelector(".unread-count");
        if (badge) {
            badge.innerText = "0";
            badge.style.display = "none";
        }
    }

    showTypingIndicator(false);
    const messages = data.messages || [];
    if (messages.length > 0) {
        const lastMsg = messages.at(-1);

        const isFromOtherUser = lastMsg.sender_id !== currentUserId;

        if (isFromOtherUser) {
            socket.send(JSON.stringify({
                type: "read",
                conversation_id: currentConversationId
            }));
            if (lastMessageEl) {
                const status = lastMessageEl.querySelector(".message-status");
                if (status) status.innerText = "read";
            }
        }
    }
}

document.getElementById("sendBtn").onclick = sendMessage;

document.getElementById("messageInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
});

document.getElementById("messageInput").addEventListener("input", handleTyping);

window.addEventListener("beforeunload", () => {
    if (socket) socket.close();
});

renderConversations();
initSocket();

</script>

{% endblock %}
