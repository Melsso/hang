{% extends "base.html" %}

{% block title %}App{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/css/home.css">
{% endblock %}

{% block content %}

<div class="app-container">

    <div id="notification-container"></div>

    <div class="top-actions">
        <button id="profileBtn">Profile</button>
        <button id="messagesBtn">Messages</button>

        <form method="post" action="/logout">
            <button type="submit">Log Out</button>
        </form>
    </div>

    <div class="swipe-card" id="profileCard">

        <div class="home-carousel">
            <button class="carousel-btn left" id="prevImage">‹</button>

            <img id="profileImage" src="/static/images/default_user.png" alt="profile image">

            <button class="carousel-btn right" id="nextImage">›</button>

            <div class="carousel-dots" id="carouselDots"></div>
        </div>

        <h2 id="name">Loading...</h2>
        <p id="bio"></p>

    </div>

    <div class="actions">
        <button class="action-btn" id="passBtn">👎</button>
        <button class="action-btn" id="super_likeBtn">⭐</button>
        <button class="action-btn" id="likeBtn">👍</button>
    </div>

</div>

<script>

let profiles = {{ profiles | tojson }};
let index = 0;
let currentImageIndex = 0;

const nameEl = document.getElementById("name");
const bioEl = document.getElementById("bio");
const card = document.getElementById("profileCard");
const imageEl = document.getElementById("profileImage");
const dotsEl = document.getElementById("carouselDots");

function renderDots(p){
    dotsEl.innerHTML = "";

    p.images.forEach((_, i) => {

        const dot = document.createElement("div");
        dot.className = "carousel-dot";

        if(i === currentImageIndex){
            dot.classList.add("active");
        }

        dot.onclick = () => {
            currentImageIndex = i;
            updateImage(p);
        };

        dotsEl.appendChild(dot);
    });
}

function updateImage(p){
    imageEl.src = p.images[currentImageIndex].image_url;

    renderDots(p);
}

function loadProfile(){
    if(index >= profiles.length){
        nameEl.innerText = "No more profiles";
        bioEl.innerText = "";
        imageEl.src = "/static/images/default_user.png";
        dotsEl.innerHTML = "";
        return;
    }

    const p = profiles[index];

    nameEl.innerText = p.first_name;
    bioEl.innerText = p.bio;

    currentImageIndex = 0;

    if(!p.images || !p.images.length){
        imageEl.src = "/static/images/default_user.png";
        dotsEl.innerHTML = "";
        return;
    }

    updateImage(p);
}

function showNotification(message){
    const container = document.getElementById("notification-container");

    const el = document.createElement("div");
    el.className = "notification";
    el.innerText = message;

    container.appendChild(el);

    setTimeout(() => {
        el.remove();
    }, 3000);
}

async function swipe(direction){
    if(index >= profiles.length) return;

    const current = profiles[index];

    const res = await fetch("/swipe", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            to_user_id: current.user_id,
            swipe_type: direction
        })
    });

    const data = await res.json();

    card.classList.add("swipe-" + direction);

    setTimeout(() => {

        card.classList.remove("swipe-pass", "swipe-like", "swipe-super_like");

        index++;
        loadProfile();

        if (data.conversation) {
            showNotification(`It's a match with ${current.first_name}!`);
        }

    }, 200);
}

document.getElementById("passBtn").onclick = () => swipe("pass");
document.getElementById("likeBtn").onclick = () => swipe("like");
document.getElementById("super_likeBtn").onclick = () => swipe("super_like");

document.getElementById("profileBtn").onclick = () => {
    window.location.href = "/profile";
};

document.getElementById("messagesBtn").onclick = () => {
    window.location.href = "/conversations";
};

document.getElementById("prevImage").onclick = () => {
    const p = profiles[index];
    if(!p.images || !p.images.length) return;

    currentImageIndex--;

    if(currentImageIndex < 0){
        currentImageIndex = p.images.length - 1;
    }

    updateImage(p);
};

document.getElementById("nextImage").onclick = () => {
    const p = profiles[index];
    if(!p.images || !p.images.length) return;

    currentImageIndex++;

    if(currentImageIndex >= p.images.length){
        currentImageIndex = 0;
    }

    updateImage(p);
};
loadProfile();

</script>

{% endblock %}
