apiVersion: kustomize.config.k8s.io/v1beta1

kind: Kustomization

namespace: prod

resources:
  - namespace.yml
  - ../../base

configMapGenerator:
  - name: api-config
    envs:
      - api.env

secretGenerator:
  - name: api-secret
    envs:
      - api.secret.env

patches:
  - path: patch-scale.yml
  
  - target:
      kind: Ingress
      name: hang
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: prod.localtest.me
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - prod.localtest.me
            secretName: hang-tls
  
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          hang/pool: prod
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: hang/pool
            operator: Equal
            value: prod
            effect: NoSchedule
  
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
