apiVersion: apps/v1

kind: Deployment

metadata:
  name: api
  labels:
    app: api

spec:
  replicas: 1
  
  selector:
    matchLabels: { app: api }
  
  template:
    metadata:
      labels: { app: api }
    
    spec:
      terminationGracePeriodSeconds: 60
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: api }

      containers:
        - name: api
          
          image: hang-backend:local
          
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: http
              containerPort: 8000
          
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }

          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }

          startupProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 2
            failureThreshold: 60

          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3