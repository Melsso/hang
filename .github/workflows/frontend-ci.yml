name: Frontend CI

on:
  push:
    paths:
      - "hang-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "hang-frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: hang-frontend

jobs:
  build:
    name: Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hang-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build