name: Backend CI

on:
  push:
    branches: [dev-api]
    paths:
      - "hang-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [dev-api]
    paths:
      - "hang-backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: hang-backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: hang-backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('hang-backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint with ruff
        run: poetry run ruff check .

      - name: Run unit tests
        run: poetry run pytest tests

      - name: Run integration tests
        run: poetry run pytest smoke_tests